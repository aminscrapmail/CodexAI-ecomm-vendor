<div class="login-wrap">
  <div class="card" style="width:min(420px,95vw)">
    <h2>Vendor Login</h2>
    <p>Login to manage your product inventory.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Username</label>
      <input formControlName="username" type="text" placeholder="Enter username" />

      <label>Password</label>
      <input formControlName="password" type="password" placeholder="Enter password" />

      <button class="primary" style="margin-top:14px;width:100%" [disabled]="isSubmitting">Login</button>
    </form>
  </div>
</div>
